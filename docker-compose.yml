version: '3.7'
services:
  react-admin:
    image: registry.cn-shenzhen.aliyuncs.com/lain_docker_server/react-admin:latest
    container_name: react-admin-backend
    hostname: system.reactadmin.com
    ports:
      # 0.0.0.0:要绑定的宿主机端口:docker容器内端口
      - "8080:8080"
    env_file:
      - ./prod.env
    expose:
      - "8080"
    depends_on:
      - mysql-db
      - redis
    networks:
      - myserver-net
    restart: always

  redis:
    image: registry.cn-shenzhen.aliyuncs.com/lain_docker_server/redis:4
    container_name: react-admin-redis
    hostname: system.redis.com
#    env_file:
#      - ./prod.env
    # 官方 redis 镜像不读取环境变量，需通过 command 传参；$$ 转义为 $ 供容器内 sh 展开 REDIS_PASSWORD
#    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    ports:
      - "6379:6379"
    expose:
      - "6379"
    volumes:
      - /usr/project/reactadmin/redis/data:/data
    networks:
      myserver-net:
        # 网络别名，确保应用容器能通过 system.redis.com 解析到本服务
        aliases:
          - system.redis.com
    restart: always

  mysql-db:
    image: registry.cn-shenzhen.aliyuncs.com/lain_wms/mysql_img:8.0.11
    container_name: mydb
    hostname: system.db.com
    env_file:
      - ./prod.env
    ports:
      - "3306:3306"
    expose:
      - "3306"
    volumes:
      - /usr/project/reactadmin/mysql/data:/var/lib/mysql
      - /usr/project/reactadmin/mysql/mysql_init_data:/docker-entrypoint-initdb.d
    networks:
      myserver-net:
        # 网络别名，确保应用容器能通过 system.db.com 解析到本服务
        aliases:
          - system.db.com
    restart: always

  nginx:
    image: registry.cn-shenzhen.aliyuncs.com/lain_docker_server/react-admin-front:latest
    container_name: react-admin-frontend
    hostname: system.reactadminfront.com
    env_file:
      - ./prod.env
    environment:
      - NGINX_HOST=system.reactadminfront.com
      - DOCKER_REQUEST_DOMAIN_PREFIX=http://react-admin:8080
    ports:
      - "80:80"
    expose:
      - "80"
    depends_on:
      - react-admin
    networks:
      - myserver-net
    restart: always

networks:
  myserver-net:
    driver: bridge