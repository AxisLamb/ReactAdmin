os:
    # 数据库类型：mysql / postgresql / sqlserver / oracle，切换后自动加载 application-dev/db-<type>.yml
    db:
        type: mysql
    cache:
        type: CAFFEINE
        redis:
            # ip: 10.10.10.181
            ip: localhost
            port: 16379
            password: 'SbtyMveYNfLzTks7H0apCmyStPzWJqjy'
            database: 0
    file:
        type: ALIYUN
        local:
            # 实际存储路径（项目根路径下）
            base-path: ./uploads/

        minio:
            endpoint: http://10.37.131.224:9000
            access-key: admin
            secret-key: password

        aliyun:
            endpoint: oss-cn-guangzhou.aliyuncs.com
            access-key-id: LTAI5t732qaqGVAxxUve8JdS
            access-key-secret: vBTaJqcYUjnugDMUOu5dLPxbvYUeEi

spring:
    config:
        # 按环境目录加载对应数据库连接配置 / 缓存连接配置（os.cache.type=REDIS 时才加载 spring.data.redis）
        import: classpath:application-dev/db-${os.db.type:mysql}.yml, classpath:application-dev/cache-${os.cache.type:CAFFEINE}.yml
    cache:
        type: GENERIC
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            # 数据库连接（driver-class-name / url / username / password）
            # 由 os.db.type 对应的 application-db-<type>.yml 提供
            initial-size: 10
            max-active: 100
            min-idle: 10
            max-wait: 60000
            pool-prepared-statements: true
            max-pool-prepared-statement-per-connection-size: 20
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            # mysql
            # sqlserver
            validation-query: SELECT 'x'
            test-while-idle: true
            test-on-borrow: true
            test-on-return: false
            stat-view-servlet:
                enabled: true
                url-pattern: /druid/*
                login-username: admin
                login-password: admin
            filter:
                stat:
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: false
                wall:
                    config:
                        multi-statement-allow: true


