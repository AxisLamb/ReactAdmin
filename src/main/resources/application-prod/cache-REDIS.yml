# os.cache.type=REDIS：加载 spring.data.redis 连接配置
# 连接参数来自 os.cache.redis.*（prod 由 REDIS_HOST / REDIS_PORT / REDIS_PASSWORD 环境变量注入）
spring:
    data:
        redis:
            host: ${os.cache.redis.ip}
            password: ${os.cache.redis.password}
            port: ${os.cache.redis.port}
            database: ${os.cache.redis.database}
