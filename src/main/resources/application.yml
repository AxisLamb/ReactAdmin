# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    max-threads: 1000
    min-spare-threads: 30
  port: 8888
  connection-timeout: 5000ms
  servlet:
    context-path: /

spring:
  # 环境 dev|test|prod（Maven 占位符，打包时由 -Pdev/-Ptest/-Pprod 注入）
  profiles:
    active: test
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
#  resources:
#    add-mappings: false
  # Spring Boot Admin 监控配置
  boot:
    admin:
      # Admin Server UI 访问路径
      context-path: /monitor
      client:
        # 注册到 Admin Server（本应用自身即是 Server，注册地址与 Server 一致）
        url: http://localhost:8888/monitor
        instance:
          # 实例名称
          name: lain-experiment
          prefer-ip: true


#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.lain.modules.*.entity
  #自定义类型处理器扫描包（兼容PostgreSQL TIMESTAMPTZ转LocalDateTime）
  type-handlers-package: com.lain.common.handler
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      logic-delete-value: -1
      logic-not-delete-value: 0
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

# application.yml
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  production: false
  basic:
    enable: false
  # 添加全局请求头配置
  gateway:
    enabled: true
    strategy: discover
  # 全局参数配置
  global-operation-parameters:
    - name: satoken
      description: 用户认证令牌
      modelRef: string
      parameterType: header
      required: false
      defaultValue: ""

# Spring Boot Actuator 监控端点配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS

# Sa-Token 配置
sa-token:
  # 是否读取 body 中 token
  is-read-body: true
  # token 名称 (同时也是 cookie 名称)
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: true
  # token 风格
  token-style: uuid
  # 是否输出操作日志
  is-log: true

# 闲鱼自动值守机器人
xianyu:
  # 是否随应用启动自动运行
  enabled: ${XIANYU_ENABLED:true}
  # 模型 API Key（环境变量 API_KEY）
  api-key: ${API_KEY:}
  # 闲鱼网页端 Cookie 字符串（环境变量 COOKIES_STR）
  cookies-str: ${COOKIES_STR:}
  # 模型服务地址（默认通义千问 OpenAI 兼容接口）
  model-base-url: ${MODEL_BASE_URL:https://api.deepseek.com}
  # 模型名称
  model-name: ${MODEL_NAME:deepseek-v4-flash}
  # 提示词目录，默认读取 classpath:prompts/，可指定外部目录覆盖（对应 PROMPT_DIR）
  prompt-dir: ${PROMPT_DIR:}
  # 心跳间隔（秒）
  heartbeat-interval: ${HEARTBEAT_INTERVAL:15}
  # 心跳超时（秒）
  heartbeat-timeout: ${HEARTBEAT_TIMEOUT:5}
  # Token 刷新间隔（秒）
  token-refresh-interval: ${TOKEN_REFRESH_INTERVAL:3600}
  # Token 刷新失败重试间隔（秒）
  token-retry-interval: ${TOKEN_RETRY_INTERVAL:300}
  # 人工接管超时时间（秒），超时自动恢复自动回复
  manual-mode-timeout: ${MANUAL_MODE_TIMEOUT:3600}
  # 消息过期时间（毫秒），过滤超时消息
  message-expire-time: ${MESSAGE_EXPIRE_TIME:300000}
  # 接管模式切换关键词（卖家发送该词切换人工/AI接管）
  toggle-keywords: ${TOGGLE_KEYWORDS:。}
  # 模拟人工输入延迟
  simulate-human-typing: ${SIMULATE_HUMAN_TYPING:false}
  # 每个会话保留的最大消息数
  max-history: ${MAX_HISTORY:100}
