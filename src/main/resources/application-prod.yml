os:
    cache:
        type: REDIS
        redis:
            # ip: 10.10.10.181
            ip: production.redis.com
            port: 6379
            # 密码通过环境变量注入，避免硬编码（与 redis 容器/外部 Redis 保持一致）
            password: ${REDIS_PASSWORD}
            database: 0
    file:
        type: ALIYUN
        local:
            base-path: /usr/lain/uploads

        minio:
            endpoint: http://production.oss.com:9000
            access-key: ${MINIO_ACCESS_KEY}
            secret-key: ${MINIO_SECRET_KEY}

        aliyun:
            # 敏感信息通过环境变量注入，避免硬编码公开（由 test.env 或系统环境变量提供）
            endpoint: ${ALIYUN_OSS_ENDPOINT}
            access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
            access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}

spring:
    cache:
        type: GENERIC
    data:
        redis:
            host: ${os.cache.redis.ip}
            password: ${os.cache.redis.password}
            port: ${os.cache.redis.port}
            database: ${os.cache.redis.database}
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            # PostgreSQL 连接
#            driver-class-name: org.postgresql.Driver
#            url: jdbc:postgresql://192.168.47.130:5432/lain_db
#            username: postgres
#            password: mysecretpassword

            # MySQL 连接
            driver-class-name: com.mysql.cj.jdbc.Driver
            url: jdbc:mysql://192.168.47.130:3306/lain_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
            username: root
            # 密码通过环境变量注入，避免硬编码
            password: ${MYSQL_PASSWORD}

            # SQL Server 连接
            #driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
            #url: jdbc:sqlserver://192.168.47.130:1433;DatabaseName=lain_db
            #username: sa
            #password: 123456

            # Oracle 连接
            #driver-class-name: oracle.jdbc.OracleDriver
            #url: jdbc:oracle:thin:@192.168.47.130:1521:lain_db
            #username: lain
            #password: 123456
            initial-size: 10
            max-active: 100
            min-idle: 10
            max-wait: 60000
            pool-prepared-statements: true
            max-pool-prepared-statement-per-connection-size: 20
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: true
            test-on-return: false
            stat-view-servlet:
                enabled: true
                url-pattern: /druid/*
                login-username: admin
                # 监控密码通过环境变量注入，避免硬编码
                login-password: ${DRUID_MONITOR_PASSWORD}
            filter:
                stat:
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: false
                wall:
                    config:
                        multi-statement-allow: true


