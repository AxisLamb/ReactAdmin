os:
    # 数据库类型：mysql / postgresql / sqlserver / oracle，切换后自动加载 application-prod/db-<type>.yml
    db:
        type: mysql
    cache:
        type: REDIS
        redis:
            # 与 docker-compose redis 服务 hostname 对齐（服务名亦可写 redis）
            ip: ${REDIS_HOST}
            port: ${REDIS_PORT}
            # 密码通过环境变量注入，避免硬编码（与 redis 容器/外部 Redis 保持一致）
            password: ${REDIS_PASSWORD}
            database: 0
    file:
        type: ALIYUN
        local:
            base-path: /usr/lain/uploads

        minio:
            endpoint: http://production.oss.com:9000
            access-key: ${MINIO_ACCESS_KEY}
            secret-key: ${MINIO_SECRET_KEY}

        aliyun:
            # 敏感信息通过环境变量注入，避免硬编码公开（由 test.env 或系统环境变量提供）
            endpoint: ${ALIYUN_OSS_ENDPOINT}
            access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID}
            access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET}

spring:
    config:
        # 按环境目录加载对应数据库连接配置 / 缓存连接配置（os.cache.type=REDIS 时才加载 spring.data.redis）
        import: classpath:application-prod/db-${os.db.type:mysql}.yml, classpath:application-prod/cache-${os.cache.type:REDIS}.yml
    cache:
        type: GENERIC
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        druid:
            # 数据库连接（driver-class-name / url / username / password）
            # 由 os.db.type 对应的 application-prod/db-<type>.yml 提供
            initial-size: 10
            max-active: 100
            min-idle: 10
            max-wait: 60000
            pool-prepared-statements: true
            max-pool-prepared-statement-per-connection-size: 20
            time-between-eviction-runs-millis: 60000
            min-evictable-idle-time-millis: 300000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: true
            test-on-return: false
            stat-view-servlet:
                enabled: true
                url-pattern: /druid/*
                login-username: admin
                # 监控密码通过环境变量注入，避免硬编码
                login-password: ${DRUID_MONITOR_PASSWORD}
            filter:
                stat:
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: false
                wall:
                    config:
                        multi-statement-allow: true


